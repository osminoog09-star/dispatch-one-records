# Настройки Dispatch One sync-агента.
# Поменяй значения под себя и сохрани файл.

# Адрес сайта, куда шлём данные (локальный сервер сообщества).
SITE_URL=http://localhost:8000

# Ключ сообщества (должен совпадать с ключом на сервере).
RECORDS_API_KEY=dev-key

# Твой позывной и имя персонажа (агент пропишет их в игре).
CALLSIGN=7-WILLIAM-1
NICKNAME=Denis Sherman

# Ждать запуска игры и работать только во время неё (1 = да).
# Так агент не грузит систему, когда ты не играешь.
WATCH_GAME=1

# Публиковать данные на сайт автоматически после выхода из игры (1 = да).
# Только для владельца сайта — у обычных игроков должно быть 0.
AUTO_PUBLISH=1

# Как часто проверять новые данные во время игры (секунды).
POLL_SECONDS=8

# Путь к данным pdComp. Обычно менять не нужно.
# PDCOMP_STORE=C:\Program Files\Rockstar Games\Grand Theft Auto V Legacy\plugins\LSPDFR\pdComp\data\store
