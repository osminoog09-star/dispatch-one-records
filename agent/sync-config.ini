# Настройки Dispatch One sync-агента.
# Поменяй значения под своё сообщество и сохрани файл.

# Адрес сайта (куда слать данные). Для локального теста оставь localhost.
SITE_URL=http://localhost:8000

# Секретный ключ сообщества (должен совпадать с ключом на сайте).
RECORDS_API_KEY=dev-key

# Как часто проверять новые данные (секунды).
POLL_SECONDS=8

# Путь к данным pdComp. Обычно менять не нужно.
# PDCOMP_STORE=C:\Program Files\Rockstar Games\Grand Theft Auto V Legacy\plugins\LSPDFR\pdComp\data\store
