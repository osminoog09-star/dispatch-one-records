<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Records{% endblock %} · {{ community }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="badge">★</span> {{ community }} <span class="sub">Records</span>
      </a>
      <nav>
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('cases') }}">Дела</a>
        <a href="{{ url_for('court') }}">Суд</a>
        <a href="{{ url_for('citations') }}">Штрафы</a>
        <a href="{{ url_for('shifts') }}">Смены</a>
        <a href="{{ url_for('staff') }}">Персонал</a>
        <a href="{{ url_for('register') }}">Регистрация</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}
        <div class="flash {{ cat }}">{{ m }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="wrap foot">{{ community }} Records · данные синхронизируются из игры</footer>
</body>
</html>
