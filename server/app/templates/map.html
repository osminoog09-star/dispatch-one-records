{% extends "base.html" %}
{% block title %}Карта{% endblock %}
{% block content %}
<h1>Карта округов</h1>
<p class="muted">Карта GTA V с крупным делением для патрулей LAPD. Нажми на округ, чтобы выделить его.</p>

<section class="clean-map-shell">
  <div class="clean-map-toolbar">
    <div>
      <span>PATROL DISTRICTS</span>
      <b>Los Santos · Blaine County</b>
    </div>
  </div>
  <div class="map-district-info" id="district-info">
    <span>Выбери округ</span>
    <b>на карте</b>
  </div>
  <div class="clean-map" id="lapd-clean-map">
    <div class="clean-map-stage">
      <img class="clean-map-image"
           src="{{ url_for('static', filename='maps/gtav/gtav-atlas-2048.png') }}"
           alt="GTA V atlas map">
      <svg class="map-district-overlay" viewBox="0 0 2048 2048" aria-label="Округа патрулирования">
        <g class="map-district" data-ru="Округ Блэйн" data-patrol="Северный патруль">
          <polygon class="map-district-shape" style="--district-color:#38bdf8"
                   points="640,235 1030,190 1430,280 1650,550 1585,870 1360,1070 890,1015 540,845 420,500"/>
          <text class="map-district-text" x="1020" y="635">Округ Блэйн</text>
        </g>
        <g class="map-district" data-ru="Округ Лос-Сантос" data-patrol="Пригород / хайвей">
          <polygon class="map-district-shape" style="--district-color:#f59e0b"
                   points="470,925 860,825 1260,900 1590,1115 1580,1400 1330,1590 900,1495 555,1285"/>
          <text class="map-district-text" x="1110" y="1180">Округ Лос-Сантос</text>
        </g>
        <g class="map-district" data-ru="Лос-Сантос" data-patrol="Городской патруль">
          <polygon class="map-district-shape" style="--district-color:#2563eb"
                   points="595,1295 930,1215 1350,1280 1595,1540 1510,1810 1185,1920 760,1830 560,1580"/>
          <text class="map-district-text" x="1020" y="1620">Лос-Сантос</text>
        </g>
      </svg>
    </div>
  </div>
</section>

<script>
document.querySelectorAll('.map-district').forEach(function(district){
  district.addEventListener('click', function(){
    document.querySelectorAll('.map-district').forEach(function(item){ item.classList.remove('active'); });
    district.classList.add('active');
    document.getElementById('district-info').innerHTML =
      '<span>' + district.dataset.ru + '</span><b>' + district.dataset.patrol + '</b>';
  });
});
</script>
{% endblock %}
