{% extends "base.html" %}
{% block title %}Карта{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQh7kA8S2qHVCef03JM/Z7y6jI7xYQo="
      crossorigin="">

<h1>Карта Лос-Сантоса</h1>
<p class="muted">Чистая карта GTA V для патрулей LAPD. Зоны и назначения добавим следующим слоем позже.</p>

<section class="clean-map-shell">
  <div class="clean-map-toolbar">
    <div>
      <span>GTA V MAP</span>
      <b>Atlas · Los Santos / Blaine County</b>
    </div>
  </div>
  <div id="lapd-clean-map" class="clean-map"></div>
  <img class="clean-map-source" src="{{ url_for('static', filename='maps/gtav/gtav-atlas-2048.png') }}" alt="" hidden>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script>
(function(){
  var imageSize = 2048;
  var mapBounds = [[0, 0], [imageSize, imageSize]];

  var map = L.map('lapd-clean-map', {
    crs: L.CRS.Simple,
    minZoom: -2,
    maxZoom: 2,
    zoomSnap: 0.25,
    zoomDelta: 0.5,
    maxBounds: mapBounds,
    maxBoundsViscosity: 0.9,
    zoomControl: false,
    attributionControl: true
  });
  window.lapdMap = map;

  var mapImageUrl = document.querySelector('.clean-map-source').getAttribute('src');
  L.imageOverlay(mapImageUrl, mapBounds, {
    attribution: 'Map: BragitOff / GTA V Atlas'
  }).addTo(map);

  map.fitBounds(mapBounds, { padding: [18, 18], animate: false });
  setTimeout(function(){ map.invalidateSize(); map.fitBounds(mapBounds, { padding: [18, 18], animate: false }); }, 150);
  window.addEventListener('resize', function(){ map.invalidateSize(); });
})();
</script>
{% endblock %}
