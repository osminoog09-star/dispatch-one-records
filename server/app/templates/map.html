{% extends "base.html" %}
{% block title %}Карта{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQh7kA8S2qHVCef03JM/Z7y6jI7xYQo="
      crossorigin="">

<h1>Карта Лос-Сантоса</h1>
<p class="muted">Чистая карта GTA V для патрулей LAPD. Зоны и назначения добавим следующим слоем позже.</p>

<section class="clean-map-shell">
  <div class="clean-map-toolbar">
    <div>
      <span>GTA V MAP</span>
      <b>Los Santos · Blaine County</b>
    </div>
    <div class="map-layer-switch" aria-label="Слой карты">
      <button type="button" class="on" data-layer="satellite">Satellite</button>
      <button type="button" data-layer="atlas">Atlas</button>
      <button type="button" data-layer="grid">Grid</button>
    </div>
  </div>
  <div id="lapd-clean-map" class="clean-map"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script>
(function(){
  var centerX = 117.3;
  var centerY = 172.8;
  var scaleX = 0.02072;
  var scaleY = 0.0205;
  var gtaCrs = L.extend({}, L.CRS.Simple, {
    projection: L.Projection.LonLat,
    scale: function(zoom){ return Math.pow(2, zoom); },
    zoom: function(scale){ return Math.log(scale) / Math.LN2; },
    distance: function(a, b){
      var dx = b.lng - a.lng;
      var dy = b.lat - a.lat;
      return Math.sqrt(dx * dx + dy * dy);
    },
    transformation: new L.Transformation(scaleX, centerX, -scaleY, centerY),
    infinite: true
  });

  var layers = {
    satellite: L.tileLayer('https://gtamap.xyz/mapStyles/styleSatelite/{z}/{x}/{y}.jpg', {
      minZoom: 0,
      maxZoom: 8,
      maxNativeZoom: 8,
      noWrap: true,
      attribution: 'Map: gtamap.xyz'
    }),
    atlas: L.tileLayer('https://gtamap.xyz/mapStyles/styleAtlas/{z}/{x}/{y}.jpg', {
      minZoom: 0,
      maxZoom: 5,
      maxNativeZoom: 5,
      noWrap: true,
      attribution: 'Map: gtamap.xyz'
    }),
    grid: L.tileLayer('https://gtamap.xyz/mapStyles/styleGrid/{z}/{x}/{y}.png', {
      minZoom: 0,
      maxZoom: 5,
      maxNativeZoom: 5,
      noWrap: true,
      attribution: 'Map: gtamap.xyz'
    })
  };

  var map = L.map('lapd-clean-map', {
    crs: gtaCrs,
    center: [0, 0],
    zoom: 3,
    minZoom: 1,
    maxZoom: 5,
    zoomControl: true,
    attributionControl: true,
    layers: [layers.satellite]
  });

  document.querySelectorAll('.map-layer-switch button').forEach(function(button){
    button.addEventListener('click', function(){
      var layerName = button.dataset.layer;
      Object.keys(layers).forEach(function(name){ map.removeLayer(layers[name]); });
      layers[layerName].addTo(map);
      document.querySelectorAll('.map-layer-switch button').forEach(function(b){ b.classList.remove('on'); });
      button.classList.add('on');
    });
  });

  window.addEventListener('resize', function(){ map.invalidateSize(); });
})();
</script>
{% endblock %}
