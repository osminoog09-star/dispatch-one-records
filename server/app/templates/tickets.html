{% extends "base.html" %}
{% block title %}Тикеты{% endblock %}
{% block content %}
<h1>Тикеты поддержки</h1>
<p class="muted">Единая очередь обращений из лаунчера и сайта. Ответ уходит игроку в тот же тикет.</p>

<div id="tk-gate" class="muted">Проверяю доступ…</div>

<div id="tk-app" style="display:none">
  <div class="tk-wrap">
    <div class="tk-list" id="tk-list"></div>
    <div class="tk-chat" id="tk-chat"><p class="muted">Выбери обращение слева.</p></div>
  </div>
</div>

<style>
  .tk-wrap{display:flex;gap:14px;align-items:flex-start}
  .tk-list{flex:0 0 260px;display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
  .tk-item{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 12px;cursor:pointer}
  .tk-item b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;word-break:break-word}
  .tk-item:hover{border-color:#2f81f7}
  .tk-item.active{border-color:#2f81f7;background:#1c232c}
  .tk-chat{flex:1;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;min-height:300px}
  .tk-msgs{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto;margin-bottom:12px}
  .tk-msg{padding:8px 12px;border-radius:8px;max-width:80%;overflow-wrap:anywhere}
  .tk-msg.me{background:#1c232c;align-self:flex-start}
  .tk-msg.op{background:#12294a;align-self:flex-end}
  .tk-reply{display:flex;gap:8px}
  .tk-reply input{flex:1;background:#1c232c;border:1px solid #30363d;color:#e6edf3;border-radius:8px;padding:8px 10px}
  .tk-reply button{background:#238636;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
  .tk-reply button.muted{background:#30363d}
  .tk-badge{font-size:11px;padding:1px 6px;border-radius:6px;background:#30363d}
  .tk-badge.open{background:#238636}
  .tk-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tk-source{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid #30363d;color:#9fc3f0;background:#101722}
  .tk-source.launcher{color:#9fe0bd;border-color:#2f6f4f;background:#102117}
  .tk-source.discord{color:#c9a6f0;border-color:#5f3f7a;background:#1b1425}
  @media(max-width:820px){
    .tk-wrap{flex-direction:column}
    .tk-list,.tk-chat{width:100%;flex:auto}
    .tk-reply{flex-wrap:wrap}
    .tk-reply input{flex-basis:100%}
  }
</style>

<script>
(function () {
  let sb, curId = null;
  function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
  function statusRu(s){return ({open:"Открыт",in_progress:"В работе",closed:"Закрыт"}[s] || s || "Открыт");}
  function sourceRu(s){return ({site:"Сайт",launcher:"Лаунчер",discord:"Discord"}[s] || "Сайт");}
  function dateRu(s){return s ? new Date(s).toLocaleString("ru-RU", { dateStyle:"short", timeStyle:"short" }) : "";}
  async function insertComment(payload) {
    const first = await sb.from("ticket_comments").insert(payload);
    if (!first.error) return first;
    const retry = Object.assign({}, payload);
    delete retry.source;
    return sb.from("ticket_comments").insert(retry);
  }

  async function load() {
    const { data: tickets } = await sb.from("tickets").select("*").order("updated_at", { ascending: false });
    const list = document.getElementById("tk-list");
    if (!tickets || !tickets.length) { list.innerHTML = '<p class="muted">Обращений нет.</p>'; return; }
    list.innerHTML = tickets.map(t =>
      '<div class="tk-item' + (String(t.id)===String(curId)?' active':'') + '" data-id="' + t.id + '">' +
        '<b>#' + t.id + ' ' + esc(t.title || "") + '</b> <span class="tk-badge ' + (t.status||'') + '">' + statusRu(t.status) + '</span>' +
        '<div class="tk-meta"><span class="tk-source ' + esc(t.source || "site") + '">' + sourceRu(t.source) + '</span>' +
        '<span class="muted small">' + esc(t.callsign || "без позывного") + ' · ' + esc(t.created_by || "игрок") + '</span>' +
        '<span class="muted small">' + dateRu(t.updated_at || t.created_at) + '</span></div></div>'
    ).join("");
    list.querySelectorAll(".tk-item").forEach(el => el.onclick = () => openTicket(el.dataset.id));
  }

  async function openTicket(id) {
    curId = id;
    document.querySelectorAll(".tk-item").forEach(x => x.classList.toggle("active", x.dataset.id === String(id)));
    const { data: c } = await sb.from("ticket_comments").select("*").eq("ticket_id", id).order("created_at");
    const chat = document.getElementById("tk-chat");
    const msgs = (c || []).map(m =>
      '<div class="tk-msg ' + (m.from_admin ? "op" : "me") + '"><b>' +
      (m.from_admin ? "Оператор" : esc(m.author || "Игрок")) + ':</b> ' + esc(m.body || "") +
      (m.attachment_url ? ' <a href="' + m.attachment_url + '" target="_blank">📎 вложение</a>' : "") + "</div>"
    ).join("");
    chat.innerHTML = '<div class="tk-msgs">' + (msgs || '<p class="muted">Сообщений нет.</p>') + "</div>" +
      '<div class="tk-reply"><input id="tk-input" placeholder="Ответ игроку…">' +
      '<button onclick="tkSend()">Отправить</button>' +
      '<button class="muted" onclick="tkClose()">Закрыть тикет</button></div>';
    const inp = document.getElementById("tk-input");
    inp.addEventListener("keydown", e => { if (e.key === "Enter") tkSend(); });
  }

  window.tkSend = async function () {
    const inp = document.getElementById("tk-input");
    const body = inp.value.trim();
    if (!body || !curId) return;
    // берём client_id тикета — чтобы игрок увидел ответ в лаунчере (он читает по своему client_id)
    const { data: t } = await sb.from("tickets").select("client_id").eq("id", curId).single();
    const { error } = await insertComment({
      ticket_id: curId, body: body, author: "Оператор", client_id: t && t.client_id, source: "site",
    });
    if (error) { alert("Не отправилось: " + error.message); return; }
    inp.value = "";
    openTicket(curId);
  };

  window.tkClose = async function () {
    if (!curId) return;
    const first = await sb.from("tickets").update({ status: "closed", closed_at: new Date().toISOString() }).eq("id", curId);
    if (first.error) await sb.from("tickets").update({ status: "closed" }).eq("id", curId);
    load();
  };

  document.addEventListener("lapd:auth", async function () {
    sb = window.lapd.sb;
    const gate = document.getElementById("tk-gate");
    if (!window.lapd.canTickets) {
      gate.innerHTML = "Только для админов, модераторов и хелперов. Войди через <b>Discord</b> и попроси выдать доступ.";
      return;
    }
    gate.style.display = "none";
    document.getElementById("tk-app").style.display = "";
    load();
  });
})();
</script>
{% endblock %}
